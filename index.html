<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiếng anh 7 - Giữa kì 2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </head>

  <style>
    .btn-custom {
      background-color: #4caf50; /* Green */
      color: white;
      border-radius: 12px; /* Rounded corners */
    }

    .btn-custom:hover {
      background-color: white;
      color: black;
      border: 2px solid #4caf50;
    }
  </style>

  <body>
    <div class="container min-vh-100 d-flex flex-column mb-5">
      <header class="mb-auto">
        <h1 class="text-center fw-bold p-5">The Midterm Test</h1>
      </header>
      
      <main class="flex-grow-1">
        <div class="container" id="idx-1"></div>
        <div class="container" id="idx-2"></div>
        <div class="container" id="idx-3"></div>
        <div class="container" id="idx-4"></div>
        <div class="container" id="idx-5"></div>
        <div class="container" id="idx-6"></div>
        <div class="container" id="idx-7"></div>
      </main>

      <footer class="mt-auto">
        <div class="d-flex justify-content-center align-items-center">
          <button id="btn-show-answer" class="btn btn-custom">Show Answer</button>
        </div>
      </footer>
    </div>
    
    <script>
      document.getElementById("btn-show-answer").addEventListener("click", function () {
        let listItems = document.querySelectorAll('.d-none');
        listItems.forEach(item => {
          item.classList.remove('d-none');
        });
        document.getElementById("btn-show-answer").style.display = "none";
      });
    </script>
    <script type="module" src="js/idx-1.js"></script>
    <script type="module" src="js/idx-2.js"></script>
  </body>
</html>
